    <!-- Jivosite "Book an Estimate" button hijack -> Jobber booking page -->
    <script>
      (function() {
        var BASE_BOOKING_URL = "https://clienthub.getjobber.com/hubs/e7849464-5cd3-44cf-8cf8-c1fd5e2eb2fb/public/requests/4986053/new";
        var ATTR_KEYS = ['utm_source','utm_medium','utm_campaign','utm_term','utm_content','gclid','gbraid','wbraid','fbclid','msclkid'];
        var TARGET = 'book an estimate';

        // Reads the same attribution payload the React app stores (see BookingUrlContext).
        function readStored() {
          var stores = [];
          try { stores.push(window.localStorage); } catch (e) {}
          try { stores.push(window.sessionStorage); } catch (e) {}
          for (var i = 0; i < stores.length; i++) {
            try {
              var raw = stores[i].getItem('lic_utms');
              if (!raw) continue;
              var parsed = JSON.parse(raw);
              if (parsed && parsed.data) return parsed.data;
              if (parsed) return parsed;
            } catch (e) {}
          }
          return {};
        }

        function getBookingUrl() {
          var url = BASE_BOOKING_URL;
          var params = [];
          if (window.location.pathname === '/gpt') {
            params.push('utm_source=chatgpt');
          } else {
            var raw = readStored();
            var stored = {};
            for (var k0 in raw) { if (Object.prototype.hasOwnProperty.call(raw, k0)) stored[k0] = raw[k0]; }
            // Keep Jobber's lead source human-readable while preserving campaign IDs.
            var source = (stored.utm_source || '').trim();
            var medium = (stored.utm_medium || '').trim().toLowerCase();
            var isNumericSource = /^\d{5,}$/.test(source);
            var isPaidMedium = ['cpc','ppc','paid','paidsearch','paid_search'].indexOf(medium) !== -1;
            var hasGoogleClickId = !!(stored.gclid || stored.gbraid || stored.wbraid);
            if (isNumericSource) {
              if (!stored.utm_campaign) stored.utm_campaign = stored.utm_source;
            }
            if (stored.msclkid && isNumericSource) {
              stored.utm_source = 'Bing Ads';
              stored.utm_medium = stored.utm_medium || 'cpc';
            } else if (stored.fbclid && isNumericSource) {
              stored.utm_source = 'Facebook Ads';
              stored.utm_medium = stored.utm_medium || 'paid_social';
            } else if (hasGoogleClickId || (isNumericSource && isPaidMedium) || (source.toLowerCase() === 'google' && isPaidMedium) || source.toLowerCase() === 'google-ads') {
              stored.utm_source = 'Google Ads';
              stored.utm_medium = stored.utm_medium || 'cpc';
            }
            var hasSource = false;
            for (var i = 0; i < ATTR_KEYS.length; i++) {
              var k = ATTR_KEYS[i];
              if (stored[k]) {
                params.push(k + '=' + encodeURIComponent(stored[k]));
                if (k === 'utm_source') hasSource = true;
              }
            }
            if (!hasSource) params.push('utm_source=website');
          }
          return url + '?' + params.join('&');
        }


        function matches(el) {
          if (!el || el.nodeType !== 1) return false;
          var txt = (el.innerText || el.textContent || '').trim().toLowerCase();
          return txt === TARGET;
        }

        // Recursively walk light + shadow DOM
        function walk(root, hits) {
          var nodes;
          try { nodes = root.querySelectorAll('*'); } catch (e) { return; }
          for (var i = 0; i < nodes.length; i++) {
            var el = nodes[i];
            if (matches(el) && !el.dataset.hijacked) hits.push(el);
            if (el.shadowRoot) walk(el.shadowRoot, hits);
          }
        }

        function attach() {
          var hits = [];
          walk(document, hits);
          hits.forEach(function(btn) {
            btn.dataset.hijacked = 'true';
            btn.addEventListener('click', function(e) {
              e.stopPropagation();
              e.preventDefault();
              window.open(getBookingUrl(), '_blank');
            }, true);
          });
        }

        // Capture-phase delegation as a backup — works even when target is inside shadow DOM
        document.addEventListener('click', function(e) {
          var path = (typeof e.composedPath === 'function') ? e.composedPath() : [];
          for (var i = 0; i < path.length; i++) {
            if (matches(path[i])) {
              e.stopPropagation();
              e.preventDefault();
              window.open(getBookingUrl(), '_blank');
              return;
            }
          }
        }, true);

        var observer = new MutationObserver(attach);
        observer.observe(document.documentElement, { childList: true, subtree: true });

        document.addEventListener('DOMContentLoaded', attach);
        setTimeout(attach, 2000);
        setTimeout(attach, 5000);
      })();
    </script>
